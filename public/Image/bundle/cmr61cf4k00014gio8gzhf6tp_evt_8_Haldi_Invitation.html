            background-repeat: no-repeat;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            container-type: inline-size;

        @supports not (aspect-ratio: 1 / 1) {
            .invitation-wrapper {
                height: 100vh;
                width: calc(100vh * (500 / 705));
            }
        }

        .content-safe-area {
            position: absolute;
            inset: 0;
            /* padding-top: 23%; */
            padding-bottom: 12%;
            padding-left: 10%;
            padding-right: 10%;
            display: grid;
            grid-template-columns: 1fr;
            align-content: safe center;
            /* Vertically center the content mass safely */
            justify-items: center;
            /* Horizontally center text */
            gap: 2.8cqi;
            /* Vertical rhythm */
            z-index: 10;
        }

        .text-block {
            box-sizing: border-box;
            max-width: 100%;
            /* Keep within the padded frame */
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-line;
            text-align: center;
            line-height: normal;
        }

        .venue-details {
            font-size: clamp(10px, 2.3vw, 13px);
            line-height: 1.5;
            white-space: pre-line;
            width: 100%;
            text-align: center;
            padding: 0 6cqi;
        }

        /* Generated Style Classes for fluid typography */
        .eventName {
            font-family: "Playfair Display", serif;
            font-size: 6.600cqi;
            color: #e43e80;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .heading {
            font-family: "Great Vibes", cursive;
            font-size: 9.080cqi;
            color: #e43e80;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .subheading {
            font-family: "Cormorant Garamond", serif;
            font-size: 4.1cqi;
            color: #e43e80;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.02em;
            width: 100%;
            max-width: 100%;
            padding: 0 6cqi;
        }

        .welcome {
            font-family: "Playfair Display", serif;
            font-size: 1.688cqi;
            color: #e43e80;
            text-align: center;
            white-space: pre-line;
            line-height: 1.5;
            letter-spacing: 0.02em;
        }

        .names {
            font-family: "Great Vibes", cursive;
            font-size: 9.080cqi;
            color: #e43e80;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .parents {
            font-family: "Playfair Display", serif;
            font-size: 1.688cqi;
            font-style: italic;
            color: #e43e80;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .details {
            font-family: "Playfair Display", serif;
            font-size: 2.8cqi;
            color: #e43e80;
            text-align: center;
            line-height: 1.6;
            letter-spacing: 0.02em;
        }

        @media (max-width: 500px) {
            body {
                align-items: flex-start;
            }

            .invitation-wrapper {
                box-shadow: none;

                max-height: unset;
                height: auto;
                aspect-ratio: 9/16;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="invitation-wrapper">
        <div class="content-safe-area">
            <div id="event-name" class="text-block eventName">Haldi</div>
            <div id="welcome-message" class="text-block subheading">Join us to celebrate</div>
            <div id="event-subheading" class="text-block heading"><span id="bride-name"
                    data-field="person-type">Anjali</span>'s haldi</div>
            <div class="text-block details"
                style="font-weight: 700;margin-top: 4.5cqi; opacity: 0.95; font-size: 1.05em;">On</div>
            <div id="event-date" class="text-block details" style="margin-top: -1.4cqi;">14th February 2026</div>
            <div class="text-block details"
                style="font-weight: 700;margin-top: 1.4cqi; opacity: 0.95; font-size: 1.05em;">At</div>
            <div id="event-time" class="text-block details" style="margin-top: -1.4cqi;">6:30 pm</div>
            <div class="text-block details"
                style="font-weight: 700;margin-top: 1.4cqi; opacity: 0.95; font-size: 1.05em;">Venue:</div>
            <div id="event-venue" class="venue-details details" style="margin-top: -1.4cqi;">The Rajputana palace,
                Adarsh Nagar, Rajasthan</div>
        </div>
    </div>
    <script>
        function fitNameText(el) {
            if (!el) return;
            var parentHeading = el.closest('#event-subheading, .heading, .names');
            var targetEl = parentHeading || el;

            targetEl.style.fontSize = '';
            targetEl.style.whiteSpace = 'nowrap';
            targetEl.querySelectorAll('span').forEach(function (s) {
                s.style.fontSize = '';
            });

            var container = targetEl.parentElement;
            if (!container) return;

            var maxW = container.clientWidth;
            if (!maxW) return;

            var currentSize = parseFloat(window.getComputedStyle(targetEl).fontSize);
            var minSize = 10;

            while (targetEl.scrollWidth > maxW && currentSize > minSize) {
                currentSize -= 0.5;
                targetEl.style.fontSize = currentSize + 'px';
            }
        }

        function fitVenueText(el) {
            if (!el) return;
            el.style.fontSize = '';

            var currentSize = parseFloat(window.getComputedStyle(el).fontSize);
            var minSize = 9;

            el.style.lineHeight = '1.3';

            while (currentSize > minSize) {
                var max2LinesHeight = currentSize * 1.3 * 2.15;
                if (el.scrollHeight <= max2LinesHeight) {
                    break;
                }
                currentSize -= 0.5;
                el.style.fontSize = currentSize + 'px';
            }
        }

        function fitAllFields() {
            var nameSelectors = '#event-subheading, .heading, .names, .name-text, #bride-name, #groom-name, [data-field="bride-name"], [data-field="groom-name"], [data-field="person-type"]';
            document.querySelectorAll(nameSelectors).forEach(function (el) {
                fitNameText(el);
            });

            var venueSelectors = '.venue-details, #event-venue, [data-field="venue-address"], [data-field="event-venue"]';
            document.querySelectorAll(venueSelectors).forEach(function (el) {
                fitVenueText(el);
            });
        }

        window.addEventListener('DOMContentLoaded', fitAllFields);
        window.addEventListener('load', fitAllFields);
        window.addEventListener('resize', fitAllFields);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitAllFields);
        }

        if (window.MutationObserver) {
            var observer = new MutationObserver(function () {
                fitAllFields();
            });
            window.addEventListener('DOMContentLoaded', function () {
                var selectors = '#event-subheading, .heading, .names, .name-text, #bride-name, #groom-name, [data-field="bride-name"], [data-field="groom-name"], [data-field="person-type"], .venue-details, #event-venue, [data-field="venue-address"], [data-field="event-venue"]';
                document.querySelectorAll(selectors).forEach(function (el) {
                    observer.observe(el, { childList: true, characterData: true, subtree: true });
                });
            });
        }
    </script>
</body>

</html>
